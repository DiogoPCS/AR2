<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute; top: 0; left: 0;
    background-color: rgba(0,0,0,0.8);
    z-index: 9999; display: flex; justify-content: center; align-items: center;
  }
  .arjs-loader div { text-align: center; font-size: 1.25em; color: white; }
</style>

<body style="margin:0; overflow:hidden;">
  <div class="arjs-loader"><div>Loading, please wait...</div></div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/foto/foto"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="personagem" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/foto/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/janela/janela"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="janela" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/janela/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/rampa/rampa"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="rampa" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/rampa/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/porta/porta"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="porta" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/porta/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/corredor/corredor"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="corredor" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/corredor/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/extintor/extintor"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="extintor" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/extintor/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- MARCADOR NFT -->
    <a-nft
      type="nft"
      url="https://diogopcs.github.io/AR2/jardim/jardim"
      smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5"
    >
      <!-- ENVOLVA O MODELO EM UMA ENTIDADE COM A CLASSE 'clickable' -->
      <a-entity id="jardim" class="clickable"
        gltf-model="https://diogopcs.github.io/AR2/jardim/scene.gltf"
        scale="1 1 1"
        position="50 50 0">
      </a-entity>
    </a-nft>

    <!-- CÂMERA + CURSOR/RAYCASTER -->
    <!-- rayOrigin: mouse permite clicar/toque na tela; o raycaster só acerta objetos com a classe configurada -->
    <a-entity camera look-controls="enabled: false">
      <a-cursor
        raycaster="objects: .clickable; far: 1000;"
        cursor="fuse: false; rayOrigin: mouse">
      </a-cursor>
    </a-entity>
  </a-scene>

  <script>
    // Quando o GLTF terminar de carregar, anexamos os eventos de clique/toque
    const alvo = document.getElementById('personagem');
    const janela = document.getElementById('janela');
    const porta = document.getElementById('porta');
    const rampa = document.getElementById('rampa');
    const corredor = document.getElementById('corredor');
    const extintor = document.getElementById('extintor');
    const jardim = document.getElementById('jardim');


    // Se quiser garantir que a malha está pronta:
    alvo.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      alvo.addEventListener('click', () => {
        alert('Você clicou no personagem!');
      });

      // Fallback extra para alguns navegadores móveis
      alvo.addEventListener('touchstart', () => {
        alert('Você tocou no personagem!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    janela.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      janela.addEventListener('click', () => {
        alert('Você clicou no janela!');
      });

      // Fallback extra para alguns navegadores móveis
      janela.addEventListener('touchstart', () => {
        alert('Você tocou no janela!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    rampa.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      rampa.addEventListener('click', () => {
        alert('Você clicou no rampa!');
      });

      // Fallback extra para alguns navegadores móveis
      rampa.addEventListener('touchstart', () => {
        alert('Você tocou no rampa!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    porta.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      porta.addEventListener('click', () => {
        alert('Você clicou no porta!');
      });

      // Fallback extra para alguns navegadores móveis
      porta.addEventListener('touchstart', () => {
        alert('Você tocou no porta!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    corredor.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      corredor.addEventListener('click', () => {
        alert('Você clicou no corredor!');
      });

      // Fallback extra para alguns navegadores móveis
      corredor.addEventListener('touchstart', () => {
        alert('Você tocou no corredor!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    extintor.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      extintor.addEventListener('click', () => {
        alert('Você clicou no extintor!');
      });

      // Fallback extra para alguns navegadores móveis
      extintor.addEventListener('touchstart', () => {
        alert('Você tocou no extintor!');
      }, { passive: true });
    });

    // Se quiser garantir que a malha está pronta:
    jardim.addEventListener('model-loaded', () => {
      // Clique com mouse (desktop) ou toque (mobile) via raycaster
      jardim.addEventListener('click', () => {
        alert('Você clicou no jardim!');
      });

      // Fallback extra para alguns navegadores móveis
      jardim.addEventListener('touchstart', () => {
        alert('Você tocou no jardim!');
      }, { passive: true });
    });
  </script>
</body>
